<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Restores deep-link paths bounced here by 404.html (see public/404.html). -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="John Campbell — Senior Software Engineer specialising in Unreal Engine simulations, VR training, digital twins, computer vision, and UI/UX design. C++, Python, C#, and more."
    />
    <title>John Campbell — Senior Software Engineer</title>

    <!-- Fonts: high-contrast serif for headings, clean grotesque for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Web analytics. Skipped for opted-out browsers: visit /?notrack=1 once
         to exclude this device, /?notrack=0 to start counting it again. -->
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search)
        if (p.get('notrack') === '1') localStorage.setItem('cf-notrack', '1')
        if (p.get('notrack') === '0') localStorage.removeItem('cf-notrack')
        if (localStorage.getItem('cf-notrack') === '1') return
        var s = document.createElement('script')
        s.defer = true
        s.src = 'https://static.cloudflareinsights.com/beacon.min.js'
        s.setAttribute('data-cf-beacon', '{"token": "2905113b73fd473cb2459e7bcc1c3fee"}')
        document.body.appendChild(s)
      })()
    </script>
  </body>
</html>
