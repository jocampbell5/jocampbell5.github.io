<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>John Campbell — Senior Software Engineer</title>
    <!--
      GitHub Pages has no server-side routing, so a deep link or refresh on a
      path like /about or /work/nfpa lands here. This re-encodes the path into a
      query string and bounces to the app root, where a snippet in index.html
      restores the real URL before React mounts. Standard SPA-on-Pages technique.
    -->
    <script>
      var segmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
